<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Niijima Design</title>
		<script type="module" src="./demo.ts"></script>
	</head>
	<body class="nj">
		<div class="stage">
			<div id="bands"></div>
			<header class="row top">
				<a class="nj-wordmark" href="#">Niijima Network<small>新島姉妹</small></a>
				<div class="nj-persona" role="group" aria-label="Persona">
					<button type="button" class="nj-persona__opt" data-who="makoto">Makoto</button>
					<button type="button" class="nj-persona__opt" data-who="sae">Sae</button>
				</div>
			</header>

			<section class="row">
				<div id="hud"></div>
				<h1 id="title" class="nj-ransom" style="--nj-ransom-size: clamp(48px, 8vw, 110px)"></h1>
			</section>

			<section class="row">
				<span class="nj-plate">Codename · Queen</span>
				<span class="nj-plate nj-plate--paper">II · Priestess</span>
				<span class="nj-plate nj-plate--hi">Persona colour</span>
				<span class="nj-plate nj-plate--red">Thief red</span>
			</section>

			<section class="row">
				<a class="nj-btn" href="#">Enter<i class="nj-btn__arrow"></i></a>
				<button class="nj-btn nj-btn--red" type="button">Save<i class="nj-btn__arrow"></i></button>
				<button class="nj-btn nj-btn--hi" type="button">Peek<i class="nj-btn__arrow"></i></button>
				<button class="nj-btn nj-btn--ghost nj-btn--small" type="button">Cancel</button>
				<button class="nj-back" type="button">
					<i class="nj-back__arrow"></i>Back<kbd>Esc</kbd>
				</button>
			</section>

			<section class="row">
				<span class="nj-stamp nj-stamp--online">Online</span>
				<span class="nj-stamp nj-stamp--soon">Coming soon</span>
				<span class="nj-stamp nj-stamp--pending">Pending</span>
				<span class="nj-stamp nj-stamp--down">Down</span>
				<span class="nj-stamp nj-stamp--locked">Locked</span>
				<span class="nj-stamp nj-stamp--hi">Persona</span>
			</section>

			<section class="row split">
				<p class="nj-counter">
					<b class="nj-counter__num">3,019,581 Ft</b><span class="nj-counter__lbl">Total</span>
				</p>
				<div class="nj-speech" style="max-width: 460px; margin-top: 60px">
					<div class="nj-speech__tag"><b>XVIII</b><span>The Moon</span></div>
					<div class="nj-speech__card">
						<p class="nj-speech__title">Mementos</p>
						<p class="nj-speech__text">
							Image vault. Drop a screenshot, get a link that embeds anywhere.
						</p>
						<a class="nj-btn nj-btn--small" href="#">Enter<i class="nj-btn__arrow"></i></a>
					</div>
				</div>
			</section>

			<section class="row">
				<button class="nj-btn nj-btn--small" type="button" id="show-loader">
					Show "Take your time"<i class="nj-btn__arrow"></i>
				</button>
			</section>
		</div>
	</body>
</html>
